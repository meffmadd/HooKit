name: verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The one repository gate: typecheck, lint, and every behavior,
      # packaging, schema, and real documentation-build test.
      - run: npm run check
