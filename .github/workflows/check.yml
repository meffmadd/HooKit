name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The full gate: typecheck + lint (pretest) and every test,
      # including the real `astro build` documentation smoke test.
      - run: npm run check
