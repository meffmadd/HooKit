# Vale prose linting config.
# Run `vale sync` after cloning to fetch the registered style packages,
# then `vale <path>` to lint (e.g. `vale site/content/docs`).
StylesPath = .vale/styles
# Gate on errors only: the `vale-docs` HooKit hook runs `vale docs` at agent
# end and requires a zero exit. Full signal is still available manually with
# `vale --minAlertLevel=suggestion <path>`.
MinAlertLevel = error
Vocab = HooKit

# Fetch the Google developer-docs style from the ValeStyles registry.
Packages = Google

[*]
BasedOnStyles = Google
