# Vale prose linting config.
# Run `vale sync` after cloning to fetch the registered style packages,
# then `vale <path>` to lint (e.g. `vale site/content/docs`).
StylesPath = .vale/styles
# Report warnings and errors so default runs surface the high-signal Google
# style findings (suggestions stay hidden — pass `--minAlertLevel=suggestion`
# for the complete signal). Vale's exit code still gates on errors only, so
# the `vale-docs` HooKit hook's zero-exit requirement holds once all errors
# are fixed while warnings stay visible.
MinAlertLevel = warning
Vocab = HooKit

# Fetch the Google developer-docs style from the ValeStyles registry.
Packages = Google

# These docs use Markdown prose plus MDX comments for schema-example markers.
# Parse .mdx as Markdown so linting does not depend on an external mdx2vast binary.
[formats]
mdx = md

[*]
BasedOnStyles = Google

# Fumadocs meta.json files contain navigation data rather than prose.
[*.json]
BasedOnStyles =
